    <script>
      // Suppress expected Vite HMR WebSocket connection errors in AI Studio iframe proxy
      (function() {
        var isWsError = function(str) {
          if (!str) return false;
          var s = String(str);
          return s.includes('WebSocket') || s.includes('ws://') || s.includes('wss://') || s.includes('closed without opened');
        };

        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.error && e.error.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e.reason && (e.reason.message || e.reason)) || '';
          if (isWsError(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
          if (isWsError(joined)) {
            return;
          }
          return origConsoleError.apply(console, args);
        };
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
